name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}

      # 1) All Python must compile (catches syntax / indentation errors)
      - name: compileall
        run: python -m compileall -q . && echo ok

      # 2) The JS embedded in the page must parse in a browser.
      #    This check was bought with an incident: when PAGE is written as a plain string, Python turns \n in the JS
      #    into real newlines, the whole <script> block becomes a syntax error -> the page sits at "connecting..." while the server is fine.
      - name: page js syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, sys
          src = pathlib.Path("caption_server.py").read_text(encoding="utf-8")
          m = re.search(r'PAGE = r?""".*?<script>(.*?)</script>', src, re.S)
          assert m, "PAGE 里找不到 <script>"
          pathlib.Path("/tmp/page.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/page.js && echo "page js ok"

      # 3) The public repo must not contain secrets / local paths / machine identity
      - name: no secrets
        run: |
          ! grep -rInE "mag-[A-Za-z0-9]{24,}|/media/[a-z]+/[a-z]+/|192\.168\.|/home/[a-z]+/|/run/user/[0-9]+" \
              --include=*.py --include=*.sh --include=*.service --include=*.md --include=*.yml .

      # 4) Every document must exist in Chinese / Japanese / English
      - name: docs are trilingual
        run: |
          for d in hardware install models llm-serving ocr-gpu usage latency \
                   testing troubleshooting architecture engineering-log; do
            for s in .md .zh.md .ja.md; do
              test -f "docs/$d$s" || { echo "missing docs/$d$s"; exit 1; }
            done
          done
          for r in README CONTRIBUTING CHANGELOG SECURITY; do
            for s in .md .zh.md .ja.md; do
              test -f "$r$s" || { echo "missing $r$s"; exit 1; }
            done
          done
          echo "trilingual ok"

      # 5) Every source file carries the license header
      - name: spdx headers
        run: |
          python - <<'PY'
          import pathlib, sys
          missing = []
          for f in pathlib.Path(".").rglob("*"):
              if not f.is_file() or "__pycache__" in str(f) or ".git/" in str(f):
                  continue
              if f.suffix in {".py", ".sh", ".js", ".service", ".yml"} or f.name == "requirements.txt":
                  head = f.read_text(encoding="utf-8", errors="ignore")[:400]
                  if "SPDX-License-Identifier: MIT" not in head:
                      missing.append(str(f))
          print("missing SPDX:", missing)
          sys.exit(1 if missing else 0)
          PY
